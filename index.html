 var h='<div class="row"><span>ลงครั้งละ</span><span class="big">'+fmt(each)+' บาท</span></div><table><tr><th>สถานการณ์สมมติ</th><th>ผลเทียบเงินต้น</th><th>มูลค่าปลายทาง</th></tr>';
 SC.forEach(function(x){h+='<tr><td>'+x[0]+'</td><td>'+(x[1]>0?"+":"")+x[1].toFixed(0)+'%</td><td>'+fmt(inv*(1+x[1]/100))+'</td></tr>'});
 el.innerHTML=h+'</table><p class="note">จำลองตามคะแนนความเสี่ยงรวม '+r.toFixed(1)+'/5 ไม่ใช่การคาดการณ์ผลตอบแทน</p>';
}
function port(){
 var ok=S.ack[0]&&S.ack[1]&&S.ack[2];
 var h='<div class="top"><h2>พอร์ตจำลอง</h2><span class="tagg">เงินสมมติ</span></div><div id="hero"></div>';
 h+='<div class="card"><b>ตั้งค่าพอร์ต</b><label for="tot">เงินลงทุนรวมต่อเดือน (บาท)</label><input type="number" id="tot" inputmode="numeric" min="0" value="'+(S.total||"")+'">';
 if(!S.pick.length)h+='<p class="note">ยังไม่ได้เลือกแบรนด์ ไปที่หน้า “ค้นหา” แล้วกด “ใส่พอร์ตจำลอง”</p>';
 S.pick.forEach(function(id){var b=B(id);h+='<label for="a-'+id+'">'+b.n+' ('+b.p+') บาทต่อเดือน</label><input type="number" id="a-'+id+'" data-a="'+id+'" inputmode="numeric" min="0" value="'+(S.amt[id]||"")+'"><button class="ghost" style="margin-top:6px" data-pick="'+id+'">เอาออกจากพอร์ต</button>'});
 h+='<div id="pf"></div><label for="th">เกณฑ์เตือนเมื่อธีมเกิน <span id="thv">'+S.th+'%</span> ของเงินลงทุนรวม</label><input type="range" id="th" min="10" max="100" step="5" value="'+S.th+'"><div id="g"></div></div>';
 h+='<div class="card"><b>จำลอง DCA</b><div class="chips"><button class="chip'+(S.freq==="m"?" on":"")+'" data-f="m">รายเดือน</button><button class="chip'+(S.freq==="w"?" on":"")+'" data-f="w">รายสัปดาห์</button></div><label for="mo">ลงต่อเนื่อง <span id="mov">'+S.mo+'</span> เดือน</label><input type="range" id="mo" min="6" max="36" value="'+S.mo+'"><div id="sim"></div><div class="les">DCA คือทยอยลงเท่า ๆ กันสม่ำเสมอ ช่วยลดปัญหาเลือกจังหวะซื้อ แต่ไม่ได้ทำให้ไม่ขาดทุน</div></div>';
 h+='<div class="card"><b>“ชอบ ไม่ได้แปลว่ากำไร”</b><p class="note" style="margin:2px 0">ติ๊กให้ครบก่อนยืนยันแผน</p>';
 ["ฉันรู้ว่าการชอบแบรนด์ ไม่ได้รับประกันว่าราคาจะขึ้น","ฉันรู้ว่ามูลค่าลงทุนอาจลดลงและอาจขาดทุนเงินต้น","ฉันใช้เฉพาะเงินเย็นที่ไม่จำเป็นต้องใช้ในระยะสั้น"].forEach(function(t,i){h+='<label class="chk"><input type="checkbox" data-k="'+i+'"'+(S.ack[i]?" checked":"")+'>'+t+'</label>'});
 h+='<div class="al wn">เดโมนี้ไม่ซื้อขายจริง ในแอปจริงจะเชื่อมกับโบรกเกอร์หรือบริษัทจัดการกองทุนที่มีใบอนุญาต</div><button class="main" id="conf"'+(ok&&sum()>0?"":" disabled")+'>ยืนยันแผน (เดโม)</button>';
 if(S.done)h+='<div class="al ok">บันทึกแผนจำลองแล้ว (ไม่มีการซื้อขายจริง) คัดลอกสรุปไปแชร์หรือเก็บไว้ได้</div><textarea readonly>'+summary()+'</textarea><button class="main" data-reset="1">เปลี่ยนแผนและจำลองใหม่</button>';
 return h+'</div>';
}
function render(){
 $("hd").innerHTML=head();tabs();
 $("v").innerHTML=S.detail?detail():[home,search,compareTab,port][S.tab]();
 if(!S.detail&&S.tab===3){guard();sim()}
}
function go(){window.scrollTo(0,0)}
$("v").onclick=function(ev){
 var t=ev.target.closest("button");if(!t)return;
 var g=function(a){return t.getAttribute(a)};
 if(t.hasAttribute("data-open")){S.detail=g("data-open");save();render();go();return}
 if(t.hasAttribute("data-back")){S.detail="";save();render();go();return}
 if(t.hasAttribute("data-try")){var id0=g("data-try");if(S.pick.indexOf(id0)<0&&S.pick.length<6){S.pick.push(id0);if(!S.amt[id0])S.amt[id0]=100}S.detail="";S.tab=3;save();render();go();return}
 if(t.hasAttribute("data-tab")){S.tab=+g("data-tab");S.detail="";save();render();go();return}
 if(t.hasAttribute("data-hz")){S.hz=+g("data-hz");save();render();return}
 if(t.hasAttribute("data-lt")){S.lt=+g("data-lt");save();render();return}
 if(t.hasAttribute("data-cmp")){var ci=g("data-cmp"),cj=S.cmp.indexOf(ci);if(cj>-1)S.cmp.splice(cj,1);else{S.cmp.push(ci);if(S.cmp.length>3)S.cmp.shift()}save();render();return}
 if(t.hasAttribute("data-watch")){var wi=g("data-watch");if(S.watch[wi])delete S.watch[wi];else S.ask=wi;save();render();return}
 if(t.hasAttribute("data-w")){var wp=g("data-w").split("|");S.watch[wp[1]]=wp[0];S.ask="";save();render();return}
 if(t.hasAttribute("data-wr")){delete S.watch[g("data-wr")];save();render();return}
 if(t.hasAttribute("data-cat")){var c=+g("data-cat"),k=S.cats.indexOf(c);if(k>-1)S.cats.splice(k,1);else S.cats.push(c);save();render();return}
 if(t.hasAttribute("data-pick")){var id=g("data-pick"),j=S.pick.indexOf(id);if(j>-1){S.pick.splice(j,1)}else if(S.pick.length<6){S.pick.push(id);if(!S.amt[id])S.amt[id]=100}save();render();return}
 if(t.hasAttribute("data-f")){S.freq=g("data-f");save();render();return}
 if(t.hasAttribute("data-reset")){S.ack=[false,false,false];S.done=false;save();render();return}
 if(t.id==="conf"){S.done=true;save();render()}
};
$("v").oninput=function(ev){
 var e=ev.target;
 if(e.id==="q"){S.q=e.value;save();var p=e.selectionStart;render();var q=$("q");q.focus();try{q.setSelectionRange(p,p)}catch(x){}return}
 if(e.id==="tot"){S.total=Math.max(0,+e.value||0);save();guard();return}
 if(e.hasAttribute("data-a")){S.amt[e.getAttribute("data-a")]=Math.max(0,+e.value||0);save();guard();return}
 if(e.id==="th"){S.th=+e.value;save();$("thv").textContent=S.th+"%";guard();return}
 if(e.id==="mo"){S.mo=+e.value;save();$("mov").textContent=S.mo;hero();sim()}
};
$("v").onchange=function(ev){var e=ev.target;if(e.hasAttribute("data-k")){S.ack[+e.getAttribute("data-k")]=e.checked;save();render()}};
$("tabs").onclick=function(ev){var t=ev.target.closest("button");if(!t)return;S.tab=+t.getAttribute("data-tab");S.detail="";save();render();go()};
$("hd").onclick=function(ev){var t=ev.target.closest("button");if(!t)return;S.tab=3;S.detail="";save();render();go()};
render();
</script>
</body>
</html>
